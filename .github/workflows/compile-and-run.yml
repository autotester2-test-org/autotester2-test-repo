name: Compile and Run C Program

on:
  workflow_dispatch:
  pull_request:
    branches:
      - arm-test
    types:
      - opened
      - synchronize

jobs:
  compile-and-run-arm:
    if: github.base_ref == 'arm-test'
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile main.c
        run: make

      - name: Run compiled program
        run: ./target/file_printer
